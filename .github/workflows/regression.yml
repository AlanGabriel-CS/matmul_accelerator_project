name: Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cocotb-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cocotb and numpy
        run: pip install cocotb numpy

      - name: Run cocotb regression
        run: |
          cd dv
          make
